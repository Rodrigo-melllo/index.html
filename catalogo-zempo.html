<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zempo.Co</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f1729;
    --ink-soft:#5b6472;
    --line:#ececef;
    --bg:#f7f7f8;
    --card:#ffffff;
    --accent-gold:#c79a3f;
    --accent-olive:#7a7233;
    --wa-green:#25D366;
    --danger-orange:#e0722c;
    --pill-bg:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{ background:var(--bg); }
  body{
    font-family:'Manrope', sans-serif;
    color:var(--ink);
    padding-bottom:40px;
    overflow-x:hidden;
  }
  img{ display:block; max-width:100%; }
  button{ font-family:inherit; border:none; background:none; cursor:pointer; }

  /* ---------------- HEADER BANNER ---------------- */
  .banner{
    position:relative;
    height:220px;
    background: linear-gradient(135deg, #55501f 0%, #8a7a2e 35%, #c9a227 70%, #e8c14a 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding-bottom:36px;
    overflow:hidden;
  }
  .banner::after{
    content:'';
    position:absolute; inset:0;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.12), transparent 55%);
  }
  .logo-badge{
    width:76px; height:76px;
    border-radius:22px;
    background:#141414;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
    position:relative;
    z-index:2;
  }
  .logo-badge svg{ width:34px; height:34px; }
  .store-name{
    display:flex; align-items:center; gap:8px;
    margin-top:14px;
    position:relative; z-index:2;
  }
  .store-name h1{
    font-size:28px;
    font-weight:800;
    color:#12140c;
    letter-spacing:-0.3px;
  }
  .verified{
    width:22px; height:22px;
    border-radius:50%;
    background:#3897f0;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .verified svg{ width:12px; height:12px; }

  /* ---------------- TRUST CHIPS ---------------- */
  .chips-row{
    display:flex; gap:10px;
    overflow-x:auto;
    padding:16px 16px 14px;
    scrollbar-width:none;
    border-bottom:1px solid var(--line);
    background:#fff;
  }
  .chips-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0;
    display:flex; align-items:center; gap:6px;
    padding:9px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    background:#fff;
  }
  .chip svg{ width:14px; height:14px; flex-shrink:0; }
  .chip.gold{ color:var(--accent-gold); }
  .chip.orange{ color:var(--danger-orange); }
  .chip.blue{ color:#3897f0; }

  /* ---------------- CATEGORY TABS ---------------- */
  .tabs-row{
    display:flex; gap:10px;
    overflow-x:auto;
    padding:14px 16px;
    scrollbar-width:none;
    background:#fff;
    border-bottom:1px solid var(--line);
  }
  .tabs-row::-webkit-scrollbar{ display:none; }
  .tab{
    flex-shrink:0;
    padding:10px 20px;
    border-radius:22px;
    border:1px solid var(--line);
    background:#fff;
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
    transition: all .15s ease;
  }
  .tab.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }

  /* ---------------- PRODUCT GRID ---------------- */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:16px;
    background:var(--bg);
  }
  .pcard{
    background:var(--card);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(15,23,41,0.06), 0 6px 16px rgba(15,23,41,0.05);
    display:flex; flex-direction:column;
  }
  .pcard-img{
    position:relative;
    aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .pcard-img svg{ width:64%; height:64%; }
  .pcard-body{ padding:12px 12px 14px; position:relative; }
  .pcard-body .pname{
    font-size:14.5px;
    font-weight:700;
    line-height:1.25;
    margin-bottom:8px;
    min-height:36px;
  }
  .pcard-body .pprice{
    font-size:15px;
    font-weight:800;
  }
  .pcard-body .plow{
    font-size:11.5px;
    font-weight:700;
    color:var(--danger-orange);
    margin-top:3px;
  }
  .add-btn{
    position:absolute;
    right:12px; bottom:12px;
    width:32px; height:32px;
    border-radius:10px;
    background:var(--wa-green);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease;
  }
  .add-btn:active{ transform:scale(0.88); }

  /* ---------------- FLOATING BUTTONS ---------------- */
  .float-cart{
    position:fixed; top:14px; right:14px;
    width:44px; height:44px;
    border-radius:50%;
    background:var(--ink);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
    z-index:50;
  }
  .float-cart svg{ width:20px; height:20px; }
  .float-wa{
    position:fixed; bottom:20px; right:16px;
    width:56px; height:56px;
    border-radius:50%;
    background:var(--wa-green);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(37,211,102,0.45);
    z-index:50;
  }
  .float-wa svg{ width:28px; height:28px; }

  /* ---------------- SHEET / MODAL OVERLAY ---------------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(10,12,20,0.5);
    z-index:100;
    display:none;
    align-items:flex-end;
  }
  .overlay.show{ display:flex; }
  .sheet{
    background:#fff;
    width:100%;
    max-height:88vh;
    border-radius:22px 22px 0 0;
    overflow-y:auto;
    padding:22px 20px 28px;
    position:relative;
    animation: slideUp .28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideUp{
    from{ transform:translateY(100%); }
    to{ transform:translateY(0); }
  }
  .sheet-close{
    position:absolute; top:16px; right:16px;
    width:32px; height:32px;
    border-radius:50%;
    background:#f0f0f2;
    display:flex; align-items:center; justify-content:center;
    z-index:2;
  }
  .sheet-close svg{ width:14px; height:14px; }

  /* product sheet */
  .sheet-img{
    width:100%;
    aspect-ratio:1/1;
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:18px;
    overflow:hidden;
  }
  .sheet-img svg{ width:56%; height:56%; }
  .sheet-img img{ width:100%; height:100%; object-fit:cover; }
  .gallery-thumbs{ display:flex; gap:8px; margin-bottom:18px; overflow-x:auto; }
  .gallery-thumbs img{
    width:56px; height:56px; object-fit:cover; border-radius:8px;
    border:2px solid transparent; flex-shrink:0; cursor:pointer;
  }
  .gallery-thumbs img.active{ border-color:var(--ink); }
  .sheet-name{ font-size:22px; font-weight:800; margin-bottom:8px; }
  .sheet-price{ font-size:20px; font-weight:800; margin-bottom:22px; }
  .field-label{ font-size:14.5px; font-weight:700; margin-bottom:10px; }
  .variant-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .variant-pill{
    padding:10px 18px;
    border-radius:20px;
    border:1.5px solid var(--line);
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    transition: all .15s ease;
  }
  .variant-pill.selected{
    border-color:var(--ink);
    background:var(--ink);
    color:#fff;
  }
  .helper-text{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; margin-bottom:22px; transition:opacity .2s ease;}
  .qty-cta-row{ display:flex; gap:12px; align-items:center; margin-top:6px; }
  .qty-stepper{
    display:flex; align-items:center;
    border:1.5px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .qty-stepper button{
    width:38px; height:42px;
    font-size:18px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink);
  }
  .qty-stepper .qty-val{
    width:32px; text-align:center;
    font-weight:700; font-size:15px;
  }
  .primary-btn{
    flex:1;
    height:48px;
    border-radius:12px;
    background:#c7c9cf;
    color:#fff;
    font-weight:700;
    font-size:14.5px;
    transition: background .2s ease;
  }
  .primary-btn.enabled{ background:var(--ink); }


</style>
</head>
<body>

<!-- ===== BANNER ===== -->
<div class="banner">
  <div class="logo-badge">
    <svg viewBox="0 0 40 40" fill="none">
      <path d="M12 10h16l-9 14h9" stroke="#c79a3f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M20 6l2 3-2 1.5-2-1.5z" fill="#c79a3f"/>
    </svg>
  </div>
  <div class="store-name">
    <h1>Zempo.Co</h1>
    <div class="verified">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>
</div>

<!-- ===== TRUST CHIPS ===== -->
<div class="chips-row">
  <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="#0f1729" stroke-width="2"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z"/></svg>Compra segura via WhatsApp</div>
  <div class="chip gold"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h7l-1 8 11-14h-7z"/></svg>Atendimento rápido</div>
  <div class="chip blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>Loja verificada</div>
</div>

<!-- ===== CATEGORY TABS ===== -->
<div class="tabs-row" id="tabsRow"></div>

<!-- ===== PRODUCT GRID ===== -->
<div class="grid" id="productGrid"></div>

<!-- ===== FLOATING WHATSAPP BUTTON ===== -->

<a class="float-wa" id="waFloat" href="#" target="_blank">
  <svg viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm0 18.02h-.01a8.1 8.1 0 0 1-4.14-1.13l-.3-.18-3.14.83.84-3.06-.19-.31a8.07 8.07 0 0 1-1.24-4.3c0-4.47 3.64-8.11 8.13-8.11 2.17 0 4.21.85 5.74 2.38a8.05 8.05 0 0 1 2.38 5.73c0 4.47-3.64 8.15-8.07 8.15z"/></svg>
</a>

<!-- ===== PRODUCT SHEET ===== -->
<div class="overlay" id="productOverlay" onclick="closeIfBackdrop(event,'productOverlay')">
  <div class="sheet" id="productSheet">
    <button class="sheet-close" onclick="closeSheet('productOverlay')">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0f1729" stroke-width="2.4" stroke-linecap="round"><path d="M4 4l16 16M20 4L4 20"/></svg>
    </button>
    <div class="sheet-img" id="sheetImg"></div>
    <div class="gallery-thumbs" id="galleryThumbs"></div>
    <div class="sheet-name" id="sheetName"></div>
    <div class="sheet-price" id="sheetPrice"></div>
    <div class="field-label">Variação</div>
    <div class="variant-row" id="variantRow"></div>
    <div class="helper-text" id="helperText" style="display:none"></div>
    <div class="qty-cta-row">
      <div class="qty-stepper">
        <button onclick="changeQty(-1)">−</button>
        <div class="qty-val" id="qtyVal">1</div>
        <button onclick="changeQty(1)">+</button>
      </div>
      <button class="primary-btn" id="addCartBtn" onclick="sendWhatsAppOrder()">Fazer pedido no WhatsApp</button>
    </div>
  </div>
</div>



<script>
/* ============ CONFIG ============ */
// ⚠️ Troque pelo número real do WhatsApp (código do país + DDD, sem espaços/símbolos)
const WHATSAPP_NUMBER = "5511999999999";

/* ============ ÍCONES por categoria (placeholders — troque pelas fotos reais) ============ */
const icons = {
  rolexPink: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#f7c9dd"/><circle cx="50" cy="50" r="30" fill="#fde4ef" stroke="#d488ac" stroke-width="2"/><line x1="50" y1="50" x2="50" y2="30" stroke="#a14a71" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="50" x2="64" y2="56" stroke="#a14a71" stroke-width="3" stroke-linecap="round"/></svg>`,
  rmDark: `<svg viewBox="0 0 100 100"><rect x="20" y="14" width="60" height="72" rx="26" fill="#1b1b1b"/><rect x="30" y="24" width="40" height="52" rx="16" fill="#2a2a2a" stroke="#c79a3f" stroke-width="1.5"/><line x1="50" y1="50" x2="50" y2="34" stroke="#e8c14a" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="50" x2="60" y2="58" stroke="#e8c14a" stroke-width="3" stroke-linecap="round"/></svg>`,
  hublot: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#d9dadd"/><circle cx="50" cy="50" r="30" fill="#232323" stroke="#8f9296" stroke-width="3"/><line x1="50" y1="50" x2="50" y2="32" stroke="#f0f0f0" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="50" x2="62" y2="50" stroke="#f0f0f0" stroke-width="3" stroke-linecap="round"/></svg>`,
  rolexSteel: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#dfe6ea"/><circle cx="50" cy="50" r="30" fill="#16324a" stroke="#0e1f30" stroke-width="2"/><path d="M20 22 A42 42 0 0 1 80 22" fill="none" stroke="#2a5a8c" stroke-width="10"/><line x1="50" y1="50" x2="50" y2="32" stroke="#fff" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="50" x2="62" y2="58" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`,
  omega: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#e7e2d6"/><circle cx="50" cy="50" r="30" fill="#faf6ee" stroke="#b8ac8e" stroke-width="2"/><line x1="50" y1="50" x2="50" y2="30" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="50" x2="63" y2="50" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/></svg>`,
  ap: `<svg viewBox="0 0 100 100"><rect x="18" y="18" width="64" height="64" rx="14" fill="#252b2f" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="26" fill="#3a4248" stroke="#7c8a92" stroke-width="2"/><line x1="50" y1="50" x2="50" y2="34" stroke="#e8e8e8" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="50" x2="60" y2="56" stroke="#e8e8e8" stroke-width="3" stroke-linecap="round"/></svg>`,
  steelChrono: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#c9cdd2"/><circle cx="50" cy="50" r="30" fill="#f4f2ec" stroke="#9a9da1" stroke-width="2"/><circle cx="40" cy="42" r="6" fill="none" stroke="#8a8f94" stroke-width="1.5"/><circle cx="60" cy="58" r="6" fill="none" stroke="#8a8f94" stroke-width="1.5"/><line x1="50" y1="50" x2="50" y2="32" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="50" x2="61" y2="46" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/></svg>`
};
const iconBg = {
  rolexPink:'#fdeef5', rmDark:'#111111', hublot:'#f1f2f4', rolexSteel:'#eef2f5', omega:'#f4f1e9', ap:'#e9ebec', steelChrono:'#eeeff1'
};

/* ============ DADOS DE PRODUTO ============ */
const products = [
  { id:6, name:"TAG Heuer Aquaracer Professional 300", price:1690, category:"Tag Heuer", icon:"steelChrono", photos: ["imagens/p6-1.jpg", "imagens/p6-2.jpg", "imagens/p6-3.jpg", "imagens/p6-4.jpg", "imagens/p6-5.jpg", "imagens/p6-6.jpg", "imagens/p6-7.jpg", "imagens/p6-8.jpg", "imagens/p6-9.jpg", "imagens/p6-10.jpg", "imagens/p6-11.jpg", "imagens/p6-12.jpg", "imagens/p6-13.jpg", "imagens/p6-14.jpg", "imagens/p6-15.jpg", "imagens/p6-16.jpg"], tag:null, variants:["Branco","Preto","Preto/Borracha"] },
  { id:5, name:"TAG Heuer Aquaracer Professional 300 GMT", price:1690, category:"Tag Heuer", icon:"steelChrono", photos: ["imagens/p5-1.jpg", "imagens/p5-2.jpg", "imagens/p5-3.jpg"], tag:null, variants:["Único"] },
  { id:4, name:"TAG Heuer Aquaracer Solargraph", price:1690, category:"Tag Heuer", icon:"steelChrono", photos: ["imagens/p4-1.jpg", "imagens/p4-2.jpg", "imagens/p4-3.jpg", "imagens/p4-4.jpg", "imagens/p4-5.jpg", "imagens/p4-6.jpg", "imagens/p4-7.jpg", "imagens/p4-8.jpg", "imagens/p4-9.jpg"], tag:null, variants:["Preto/Dourado","Verde"] },
  { id:3, name:"TAG Heuer Carrera Calibre 16", price:1690, category:"Tag Heuer", icon:"steelChrono", photos: ["imagens/p3-1.jpg", "imagens/p3-2.jpg", "imagens/p3-3.jpg", "imagens/p3-4.jpg", "imagens/p3-5.jpg"], tag:null, variants:["Único"] },
  { id:2, name:"TAG Heuer Fórmula 1 Edição Especial Senna", price:1690, category:"Tag Heuer", icon:"steelChrono", photos: ["imagens/p2-1.jpg", "imagens/p2-2.jpg", "imagens/p2-3.jpg"], tag:null, variants:["Único"] },
  { id:1, name:"TAG Heuer Carrera Chronograph Seafarer", price:1690, category:"Tag Heuer", icon:"steelChrono", photos: ["imagens/p1-1.jpg", "imagens/p1-2.jpg", "imagens/p1-3.jpg", "imagens/p1-4.jpg", "imagens/p1-5.jpg"], tag:null, variants:["Único"] }
];
const categories = ["Todos","Rolex","Omega","Audemars","Tag Heuer","Cartier","Patek Philippe"];

/* ============ STATE ============ */
let activeCategory = "Todos";
let currentProduct = null;
let selectedVariant = null;
let currentQty = 1;

/* ============ RENDER: TABS ============ */
function renderTabs(){
  const row = document.getElementById('tabsRow');
  row.innerHTML = categories.map(c =>
    `<button class="tab ${c===activeCategory?'active':''}" onclick="setCategory('${c}')">${c}</button>`
  ).join('');
}
function setCategory(c){ activeCategory = c; renderTabs(); renderGrid(); }

/* ============ RENDER: GRID ============ */
function renderGrid(){
  const grid = document.getElementById('productGrid');
  const list = activeCategory==="Todos" ? products : products.filter(p=>p.category===activeCategory);
  if(list.length===0){
    grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px 20px; color:var(--ink-soft); font-size:14px;">Nenhum relógio cadastrado ainda nesta categoria.</div>`;
    return;
  }
  grid.innerHTML = list.map(p => `
    <div class="pcard">
      <div class="pcard-img" style="background:${iconBg[p.icon]}" onclick="openProduct(${p.id})">${p.photos && p.photos.length ? `<img src="${p.photos[0]}" style="width:100%;height:100%;object-fit:cover;">` : icons[p.icon]}</div>
      <div class="pcard-body">
        <div class="pname" onclick="openProduct(${p.id})">${p.name}</div>
        <div class="pprice">${fmt(p.price)}</div>
        ${p.tag ? `<div class="plow">${p.tag}</div>` : ''}
        <button class="add-btn" onclick="quickOrder(${p.id})" title="Pedir no WhatsApp">
          <svg viewBox="0 0 24 24" fill="#fff" width="16" height="16"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm0 18.02h-.01a8.1 8.1 0 0 1-4.14-1.13l-.3-.18-3.14.83.84-3.06-.19-.31a8.07 8.07 0 0 1-1.24-4.3c0-4.47 3.64-8.11 8.13-8.11 2.17 0 4.21.85 5.74 2.38a8.05 8.05 0 0 1 2.38 5.73c0 4.47-3.64 8.15-8.07 8.15z"/></svg>
        </button>
      </div>
    </div>
  `).join('');
}
function fmt(v){ return "R$ " + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }

/* ============ PRODUCT SHEET ============ */
function openProduct(id){
  currentProduct = products.find(p=>p.id===id);
  selectedVariant = currentProduct.variants[0];
  currentQty = 1;
  document.getElementById('sheetImg').style.background = iconBg[currentProduct.icon];
  const hasPhotos = currentProduct.photos && currentProduct.photos.length;
  document.getElementById('sheetImg').innerHTML = hasPhotos ? `<img id="mainSheetImg" src="${currentProduct.photos[0]}">` : icons[currentProduct.icon];
  const thumbsEl = document.getElementById('galleryThumbs');
  if(hasPhotos && currentProduct.photos.length > 1){
    thumbsEl.style.display = 'flex';
    thumbsEl.innerHTML = currentProduct.photos.map((src, i) =>
      `<img src="${src}" class="${i===0?'active':''}" onclick="switchMainPhoto(${i}, this)">`
    ).join('');
  } else {
    thumbsEl.style.display = 'none';
    thumbsEl.innerHTML = '';
  }
  document.getElementById('sheetName').textContent = currentProduct.name;
  document.getElementById('sheetPrice').textContent = fmt(currentProduct.price);
  document.getElementById('variantRow').innerHTML = currentProduct.variants.map((v,i) =>
    `<button class="variant-pill ${i===0?'selected':''}" onclick="pickVariant('${v}', this)">${v}</button>`
  ).join('');
  document.getElementById('qtyVal').textContent = 1;
  updateAddBtnState();
  document.getElementById('productOverlay').classList.add('show');
}
function switchMainPhoto(index, el){
  const mainImg = document.getElementById('mainSheetImg');
  if(mainImg && currentProduct.photos) mainImg.src = currentProduct.photos[index];
  document.querySelectorAll('.gallery-thumbs img').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function pickVariant(v, el){
  selectedVariant = v;
  document.querySelectorAll('.variant-pill').forEach(p=>p.classList.remove('selected'));
  el.classList.add('selected');
  updateAddBtnState();
}
function updateAddBtnState(){
  const btn = document.getElementById('addCartBtn');
  const helper = document.getElementById('helperText');
  btn.classList.add('enabled');
  helper.style.display = 'none';
}
function changeQty(delta){
  currentQty = Math.max(1, currentQty + delta);
  document.getElementById('qtyVal').textContent = currentQty;
}
function confirmAddToCart(){
  // mantido por compatibilidade, não usado mais
}
function sendWhatsAppOrder(){
  let msg = `Olá! Gostaria de fazer o seguinte pedido:\n\n`;
  msg += `• ${currentProduct.name} (${selectedVariant}) — Qtd: ${currentQty} — ${fmt(currentProduct.price)}\n`;
  msg += `\nTotal: ${fmt(currentProduct.price * currentQty)}\n\nPodem confirmar disponibilidade?`;
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
  closeSheet('productOverlay');
}
function quickOrder(id){
  const p = products.find(x=>x.id===id);
  const v = p.variants[0];
  let msg = `Olá! Gostaria de fazer o seguinte pedido:\n\n`;
  msg += `• ${p.name} (${v}) — Qtd: 1 — ${fmt(p.price)}\n`;
  msg += `\nTotal: ${fmt(p.price)}\n\nPodem confirmar disponibilidade?`;
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

/* ============ FLOAT WHATSAPP (contato geral) ============ */
document.getElementById('waFloat').href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent("Olá! Vim pelo catálogo da Zempo.Co e gostaria de mais informações.")}`;

/* ============ SHEET HELPERS ============ */
function closeSheet(id){ document.getElementById(id).classList.remove('show'); }
function closeIfBackdrop(e, id){ if(e.target.id===id) closeSheet(id); }

/* ============ INIT ============ */
renderTabs();
renderGrid();
</script>
